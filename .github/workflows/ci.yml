name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight CI runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Piso é node >= 22 (engines do package). O 20 saiu em 31/08/2026: fim
        # de vida em 30/04/2026, sem correção de segurança desde então.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify bundle registers expected tool count
        run: |
          count=$(grep -o "toolRegistry.register" dist/index.js | wc -l)
          echo "Source-level register call sites: $count"
          test "$count" -eq 37 || { echo "Expected 37, got $count"; exit 1; }

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Build worker-lib bundle
        run: npm run build:worker-lib

      - name: Install dependencies (worker)
        run: npm ci
        working-directory: worker

      - name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      - name: Run tests (worker)
        run: npm test
        working-directory: worker
