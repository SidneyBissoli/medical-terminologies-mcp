name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight CI runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify bundle registers expected tool count
        run: |
          count=$(grep -o "toolRegistry.register" dist/index.js | wc -l)
          echo "Source-level register call sites: $count"
          test "$count" -eq 27 || { echo "Expected 27, got $count"; exit 1; }
