name: Deploy to Cloudflare Workers

# Two trigger paths:
# - push to main: continuous deployment after PR merge (keeps the hosted
#   URL in lockstep with the published npm package).
# - workflow_dispatch: manual redeploy without a code change (e.g. after
#   rotating a secret or after a Cloudflare runtime update).
#
# The Worker (worker/) is an instance of the portfolio's Fase 0 hosting
# template. It consumes the parent package through dist/worker-lib.js
# (npm run build:worker-lib at the repo root), so the root install+build
# happens before the wrangler deploy from worker/.
#
# Requires two GitHub secrets:
#   CLOUDFLARE_API_TOKEN — scoped token with "Workers Scripts: Edit"
#                         permission for the target account
#   CLOUDFLARE_ACCOUNT_ID — account ID the worker deploys into
#   (WHO_CLIENT_ID + WHO_CLIENT_SECRET are NOT GitHub secrets — they're
#    set via `wrangler secret put` on the Cloudflare side because they're
#    only needed at the Worker's runtime, not at build time.)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm ci

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Build worker-lib bundle
        run: npm run build:worker-lib

      - name: Install dependencies (worker)
        run: npm ci
        working-directory: worker

      - name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
