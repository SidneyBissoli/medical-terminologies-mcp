name: Deploy to Cloudflare Workers

# Two trigger paths:
# - push to main: continuous deployment after PR merge (keeps the hosted
#   URL in lockstep with the published npm package).
# - workflow_dispatch: manual redeploy without a code change (e.g. after
#   rotating a secret or after a Cloudflare runtime update).
#
# The Worker (worker/) is an instance of the portfolio's Fase 0 hosting
# template. It consumes the parent package through dist/worker-lib.js
# (npm run build:worker-lib at the repo root), so the root install+build
# happens before the wrangler deploy from worker/.
#
# Requires two GitHub secrets:
#   CLOUDFLARE_API_TOKEN — scoped token with "Workers Scripts: Edit"
#                         permission for the target account
#   CLOUDFLARE_ACCOUNT_ID — account ID the worker deploys into
#   (WHO_CLIENT_ID + WHO_CLIENT_SECRET are NOT GitHub secrets — they're
#    set via `wrangler secret put` on the Cloudflare side because they're
#    only needed at the Worker's runtime, not at build time.)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'surface.lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies (root)
        run: npm ci

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Build worker-lib bundle
        run: npm run build:worker-lib

      # THE DEPLOY REFUSES TO RUN WITH A RED SUITE. Until 2026-10-02 this job
      # only type-checked. The suite includes the surface lock
      # (src/surface-lock.test.ts): surface changed without a version bump =
      # red here, and wrangler below never runs.
      - name: Tests (root) — includes the declared-surface lock
        run: npm test

      - name: Install dependencies (worker)
        run: npm ci
        working-directory: worker

      - name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      # The other half of the lock (worker/tests/surface-lock.test.ts): the
      # server the Worker builds on its own serves the locked surface, and
      # which methods answer without a token — behaviour no listing shows.
      - name: Tests (worker) — includes the no-token lock
        run: npm test
        working-directory: worker

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      # The guard the smoke does not give: the smoke exercises the surface but
      # would pass just the same while serving the PREVIOUS version — exactly
      # the drift this workflow exists to prevent (bcb served 1.3.1 for months
      # while npm was at 1.3.5; senado served 3.5.0 for five days while npm was
      # at 3.5.1, measured 2026-08-29). Comparing what /status reports against
      # package.json turns that drift red instead of silent. The sleep gives
      # Cloudflare propagation time — right after a deploy the edge serves
      # mixed isolates for a few seconds.
      - name: Hosted version matches package.json
        run: |
          # Retries for up to 3 min (2026-10-06). A single read after `sleep 20` gave a
          # false red when the new Worker took longer to reach the edge — and that false
          # red SKIPPED the smoke and the surface check (measured on senado, run
          # 37515023242). /status answers `no-store`: the delay is propagation.
          EXPECTED=$(node -p "require('./package.json').version")
          DEADLINE=180; INTERVAL=10; START=$(date +%s); LIVE="?"
          while :; do
            # A network error or invalid JSON does not break the loop: it becomes "?" and retries.
            LIVE=$(curl -sS --max-time 30 https://medical.sidneybissoli.com/status 2>/dev/null \
              | node -e "try{console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)}catch{console.log('?')}" \
              || echo "?")
            ELAPSED=$(( $(date +%s) - START ))
            echo "t=${ELAPSED}s  package.json=$EXPECTED  hosted=$LIVE"
            [ "$EXPECTED" = "$LIVE" ] && exit 0
            if [ "$ELAPSED" -ge "$DEADLINE" ]; then
              echo "::error::drift: after ${DEADLINE}s the endpoint serves $LIVE while the repo is at $EXPECTED"
              exit 1
            fi
            sleep "$INTERVAL"
          done

      # Closes the loop: if the deploy ships a broken worker, the job fails
      # here — not silently the next time someone opens the endpoint.
      - name: Production smoke
        run: node scripts/smoke-mcp.mjs

      # What went live is what was locked: declared surface served without a
      # credential and, method by method, who answers without a token
      # (production = API_KEY absent). The tests prove the CODE; this proves
      # the ENDPOINT.
      - name: Live surface = surface.lock.json
        run: npx mcp-surface verificar https://medical.sidneybissoli.com/mcp --tool cid10_chapters --args '{}'
