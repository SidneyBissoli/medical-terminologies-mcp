name: mcpscore (contrato de qualidade)

# O QUE ISTO GUARDA, e por que é contrato e não métrica.
#
# `mcpscore` é auditor determinístico (sem juiz LLM): conecta como cliente MCP
# real e verifica conformidade de protocolo, qualidade das tools, segurança/auth
# e prontidão para a spec 2026-07-28. É o ÚNICO dos quatro agregadores que mede
# o SERVIDOR RODANDO — mcpindex, Glama e LobeHub leem ficha e repositório.
# Por isso aqui ele deixa de ser número no painel e vira gate.
#
# CATRACA, não meta. O piso é o valor MEDIDO, arredondado para baixo: impede
# regressão sem prometer melhora. Ao subir a nota de verdade, suba o piso na
# mesma passada — senão a catraca protege um patamar que o servidor já não tem.
#
# DOIS PISOS, e a diferença não é arbitrária: no stdio várias regras de HTTP
# não se aplicam e o denominador muda, então a mesma implementação pontua
# diferente nos dois transportes. Um piso único reprovaria o stdio.
#
# HISTÓRICO DOS PISOS
#  - 30/08/2026, primeira medição e primeiro gate. Este era o ÚNICO servidor
#    publicado do portfólio sem `mcpscore.yml` — os outros cinco tinham catraca
#    e este não, então uma regressão de conformidade aqui não reprovava nada.
#    Antes das correções: 163/173 = 94,2% em produção, com 9 achados (os quatro
#    cursores de paginação, `title` e `icons` no serverInfo, `server/discover`,
#    e títulos ausentes em 4 resources e 3 prompts). Depois: stdio 146/148 =
#    98,6% -> piso 98; produção -> piso 100.
#    ATENÇÃO ao que custou dois deploys no ibge: `title`/`icons`/`discover`
#    moram em DOIS lugares — `src/register.ts` (stdio) e `worker/src/server.ts`
#    (HTTP). Corrigir só a raiz deixa produção para trás com CI verde. O guarda
#    é `worker/tests/serverinfo-sync.test.ts`.
#
# UM PISO DE 100 É DESCONFORTÁVEL DE PROPÓSITO. Ele fica vermelho tanto numa
# regressão nossa quanto numa REGRA NOVA do auditor que ainda não atendemos — e
# a segunda também é notícia, não ruído. Quem baixar este piso está decidindo
# não saber.
#
# O QUE SOBRA NO STDIO: os 2 pontos que faltam são
# `readiness_2026_unsupported_version_error` — versão de protocolo desconhecida
# não vira -32022. No stdio o `serveStdio` do SDK classifica um `initialize` sem
# envelope moderno como ciclo LEGADO e responde com a revisão que suporta, que é
# o que a spec de 2025 pede; não há opção que mude isso sem desligar o ciclo
# legado e quebrar a maioria dos clientes. bcb e ilo reprovam a mesma regra no
# mesmo transporte. É limite do SDK, não deste repositório.
#
# O gate do PR mede o CÓDIGO DO PR (stdio, servidor local). O pós-deploy mede
# o que FOI AO AR. São perguntas diferentes e por isso são dois jobs.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  stdio:
    name: contrato no código do PR (stdio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build (o auditor precisa do bundle, não do fonte)
        run: npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Auditar o servidor local
        run: uvx mcpscore --fail-under 98 --stdio node dist/index.js

  remoto:
    name: contrato no que está no ar (streamable http)
    # Só no push: num PR o endpoint ainda serve o código anterior, e reprovar
    # o PR por isso mediria a coisa errada.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Auditar o endpoint em produção
        run: uvx mcpscore --fail-under 94 https://medical.sidneybissoli.com/mcp
