# Cloudflare Workers config — production deployment of the Streamable HTTP
# transport. Reference: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Deploy from CI: see .github/workflows/deploy-worker.yml (triggered on tag).
# Deploy locally: `npx wrangler deploy` (after `wrangler login`).
# Iterate locally: `npx wrangler dev` (boots a Miniflare runtime on :8787).
#
# After first deploy: set secrets so ICD-11 tools work.
#   npx wrangler secret put WHO_CLIENT_ID
#   npx wrangler secret put WHO_CLIENT_SECRET

name = "medical-terminologies-mcp"
main = "dist/worker.js"
compatibility_date = "2025-12-01"

# Keep the default *.workers.dev hostname enabled alongside the custom domain.
# Wrangler 4.x disables workers.dev by default when it's absent from this file,
# which would 404 the legacy medical-terminologies-mcp.sidneybissoli.workers.dev
# endpoint that server.json / README / the Smithery listing still point at.
# Both hostnames serve the same Worker during the cutover; this can be flipped
# to false once every reference has moved to medical.sidneybissoli.com.
workers_dev = true

# nodejs_compat exposes node:buffer / node:events / node:stream etc. — pino
# and node-cache need this. The Workers runtime ships a partial Node API
# behind this flag, sufficient for our bundled code without a full polyfill.
compatibility_flags = ["nodejs_compat"]

# Custom domain — maps medical.sidneybissoli.com to this Worker, matching the
# per-server `<name>.sidneybissoli.com/mcp` convention used by the maintainer's
# other MCPs (senado., ibge.). With custom_domain = true, `wrangler deploy`
# provisions the DNS record + TLS cert automatically (sidneybissoli.com is a
# zone on the same Cloudflare account), so no dashboard step is needed. The
# default *.workers.dev hostname keeps working in parallel — this is additive,
# not a replacement, so existing listings don't break during the cutover.
# To manage the domain via the dashboard instead (the maintainer's prior
# pattern), delete this block and add the custom domain there.
[[routes]]
pattern = "medical.sidneybissoli.com"
custom_domain = true

# Surface invocation metrics + structured logs in the Cloudflare dashboard
# and via `wrangler tail`. Free; no cost impact.
[observability]
enabled = true

# Stats counter — a single Durable Object instance ("global") aggregates
# per-tool invocation counts across all isolates. Persisted to DO storage
# (durable SQLite under the hood) so cold starts don't reset the counter.
# Read by GET /stats, GET /stats/badge, and the info://stats MCP resource.
# Phase 11.9 Stage 2 (cache KV + DO rate limiter) is still trigger-gated;
# the stats DO arriving first is fine — it's an isolated workload.
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsCounter"]
